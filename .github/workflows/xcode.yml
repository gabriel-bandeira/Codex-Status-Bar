name: Xcode

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    name: Build and Analyze
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project "Codex Status Bar.xcodeproj" \
            -scheme "Codex Status Bar" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build local app bundle
        run: |
          rm -rf build-output artifacts
          xcodebuild \
            -project "Codex Status Bar.xcodeproj" \
            -scheme "Codex Status Bar" \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$PWD/build-output/DerivedData" \
            SYMROOT="$PWD/build-output/Products" \
            INFOPLIST_KEY_LSUIElement=YES \
            ENABLE_APP_SANDBOX=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            build

      - name: Package local app bundle
        run: |
          mkdir -p artifacts
          ditto -c -k --keepParent \
            "build-output/Products/Release/Codex Status Bar.app" \
            "artifacts/Codex-Status-Bar-local-arm64.zip"

      - name: Upload local build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Status-Bar-local-arm64
          path: artifacts/Codex-Status-Bar-local-arm64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "artifacts/Codex-Status-Bar-local-arm64.zip" \
            --title "Codex Status Bar ${GITHUB_REF_NAME}" \
            --notes "Local ad-hoc Apple Silicon build. This app is not notarized; macOS may require manual approval on first launch."

      - name: Analyze
        run: |
          xcodebuild \
            -project "Codex Status Bar.xcodeproj" \
            -scheme "Codex Status Bar" \
            -configuration Debug \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            analyze
